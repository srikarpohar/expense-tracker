name: expense-tracker
services:
  shared-types:
    build:
      context: .
      dockerfile: Dockerfile
      target: shared-types
    volumes:
      - type: bind
        source: ./types/src
        target: /app/types/src
      - shared-types:/app/types/dist
      
  shared-utils:
    build:
      context: .
      dockerfile: Dockerfile
      target: shared-utils
    volumes:
      - type: bind
        source: ./utils/src
        target: /app/utils/src
      - shared-types:/app/types/dist
      - shared-utils:/app/utils/dist
    depends_on:
      shared-types:
        condition: service_started

  database:
    image: postgres:18
    secrets:
      - db-credentials
    ports:
      - "5435:5432"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -a
        source /run/secrets/db-credentials
        set +a
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "set -a && . /run/secrets/db-credentials && pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql

  backend-dev:
    ports:
      - "3000:3000"
      - "9229:9229"
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    volumes:
      - type: bind
        source: ./apps/backend/main-app
        target: /app/apps/backend/main-app
      - backend-node-modules:/app/apps/backend/main-app/node_modules
      - shared-types:/app/types/dist
      - shared-utils:/app/utils/dist
    depends_on:
      shared-utils:
        condition: service_started
      database:
        condition: service_healthy

  frontend-dev:
    ports:
      - "4200:4200"
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    stdin_open: true
    volumes:
      - type: bind
        source: ./apps/frontend/et-web
        target: /app/apps/frontend/et-web
      - frontend-node-modules:/app/apps/frontend/et-web/node_modules
      - shared-types:/app/types/dist
      - shared-utils:/app/utils/dist
    depends_on:
      shared-utils:
        condition: service_started
      database:
          condition: service_healthy
  
  # database-prod:
  #   image: postgres:18
  #   secrets:
  #     - db-credentials
  #   ports:
  #     - "5435:5432"
  #   entrypoint:
  #     - /bin/bash
  #     - -c
  #     - |
  #       set -a
