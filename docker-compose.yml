  #   volumes:
  #     - db-data:/var/lib/postgresql

  backend-prod:
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: backend-prod

  frontend-prod:
    ports:
      - "4200:4200"
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: frontend-prod

volumes:
  frontend-node-modules:
    driver: local
  backend-node-modules:
    driver: local
  shared-types:
    driver: local
  shared-utils:
    driver: local
  db-data:
    driver: local

secrets:
  db-credentials:
    file: ./secrets/db_credentials.env
  db-credentials-prod:
    file: ./secrets/db_credentials.env.production